name: Build extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails if the vendored spec was edited without updating its hash, or if
      # src/generated/ differs from what the pinned generator produces.
      - run: npm run generate:check
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Syntax-check JavaScript
        run: |
          for f in src/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify credential storage boundary
        run: node tests/storage-boundary.mjs

      - name: Reject unsafe anonymization responses
        run: node tests/anonymize-safety.mjs

      - name: Keep send interception closed
        run: node tests/send-guard.mjs

      - name: Reject failed, malformed and slow API responses
        run: node tests/api-core.mjs

      - name: Read manifest version
        id: meta
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=pii-browser-ext-$version.zip" >> "$GITHUB_OUTPUT"

      # A release tag that disagrees with manifest.json produces a store upload
      # rejected for a duplicate version number — catch it before packaging.
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag v$tag does not match manifest version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - name: Build zip
        run: |
          zip -r "${{ steps.meta.outputs.zip }}" . \
            -x '.git/*' '.github/*' '.gitignore' '*/.DS_Store' '.DS_Store' '*.pem' '*.crx' '*.zip' \
               'node_modules/*' 'package.json' 'package-lock.json' 'tsconfig.json' 'openapi/*' 'src/generated/*' 'tests/*' 'TESTING.md' 'CHANGELOG.md'
          unzip -l "${{ steps.meta.outputs.zip }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pii-browser-ext-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.meta.outputs.zip }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.meta.outputs.zip }}" --clobber
