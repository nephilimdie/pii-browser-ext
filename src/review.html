<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proteggi immagine · Pseudora</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="review.css">
</head>
<body class="pii-ui">
  <main>
    <header>
      <img src="../icons/icon48.png" width="32" height="32" alt="">
      <div><h1>Proteggi un'immagine</h1><p>Rivedi le aree dubbie prima di scaricare il risultato.</p></div>
    </header>
    <div class="toolbar">
      <button id="import-url" type="button" hidden>Importa immagine selezionata</button>
      <label class="file-control" for="image-file">Scegli immagine</label>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp">
      <span id="file-name"></span>
      <button id="protect" type="button" disabled>Proteggi</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <div class="review-layout">
        <div class="canvas-wrap"><canvas id="image" aria-label="Anteprima dell'immagine protetta"></canvas></div>
        <aside>
          <h2>Revisione</h2>
          <p id="summary"></p>
          <p class="warning">Le aree rese visibili possono contenere dati personali. Controlla l'immagine prima di condividerla.</p>
          <div id="regions" role="group" aria-label="Aree dubbie"></div>
          <button id="add-cover" type="button" aria-pressed="false">Aggiungi copertura</button>
          <button id="clear-covers" type="button">Rimuovi coperture aggiunte</button>
          <button id="attach" type="button" hidden>Allega alla chat</button>
          <button id="download" type="button">Scarica immagine protetta</button>
        </aside>
      </div>
    </section>
  </main>
  <script src="review.js"></script>
</body>
</html>
